<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pré-Conselho - Painel do Administrador</title>
    
    <!-- GUARDA DE ROTA: Executada imediatamente antes de renderizar a página -->
    <script>
        (function() {
            const usuarioRaw = localStorage.getItem('usuario') || localStorage.getItem('user');
            if (!usuarioRaw) {
                window.location.href = 'index.html';
                return;
            }
            try {
                const usuario = JSON.parse(usuarioRaw);
                const tipo = String(usuario.tipo || usuario.role || usuario.perfil || '').toLowerCase();
                if (tipo !== 'admin') {
                    alert('Acesso negado: Perfil de Administrador necessário.');
                    window.location.href = 'index.html';
                }
            } catch (e) {
                localStorage.clear();
                window.location.href = 'index.html';
            }
        })();
    </script>

    <style>
        :root {
            --bg-color: #f4f6f9;
            --card-bg: #ffffff;
            --text-color: #1a1a1a;
            --border-color: #e0e0e0;
            --primary-blue: #0056b3;
            --primary-hover: #003d82;
            --danger-red: #d9534f;
            --danger-hover: #c9302c;
            --input-bg: #ffffff;
            --shadow: 0 4px 12px rgba(0, 0, 0, 0.08);
            --table-header-bg: #f8f9fa;
        }

        [data-theme="dark"] {
            --bg-color: #0d1117;
            --card-bg: #161b22;
            --text-color: #f0f6fc;
            --border-color: #30363d;
            --primary-blue: #1f6beb;
            --primary-hover: #388bfd;
            --danger-red: #f85149;
            --danger-hover: #da3633;
            --input-bg: #0d1117;
            --shadow: 0 4px 12px rgba(0, 0, 0, 0.4);
            --table-header-bg: #21262d;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            transition: background-color 0.3s, color 0.3s;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1rem 2rem;
            background-color: var(--card-bg);
            border-bottom: 1px solid var(--border-color);
        }

        .header-title {
            font-size: 1.25rem;
            font-weight: 700;
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .user-badge {
            font-size: 0.9rem;
            font-weight: 600;
            background-color: var(--border-color);
            padding: 0.4rem 0.8rem;
            border-radius: 20px;
        }

        .icon-btn {
            background: none;
            border: 1px solid var(--border-color);
            padding: 8px;
            border-radius: 8px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-color);
            transition: background-color 0.2s;
        }

        .icon-btn:hover {
            background-color: var(--border-color);
        }

        .icon-btn svg {
            width: 20px;
            height: 20px;
            fill: currentColor;
        }

        .btn-logout {
            background-color: var(--danger-red);
            color: #ffffff;
            border: none;
            padding: 0.5rem 1rem;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .btn-logout:hover {
            background-color: var(--danger-hover);
        }

        main {
            flex: 1;
            padding: 2rem;
            max-width: 1200px;
            width: 100%;
            margin: 0 auto;
        }

        .nav-tabs {
            display: flex;
            gap: 0.5rem;
            border-bottom: 2px solid var(--border-color);
            margin-bottom: 1.5rem;
            flex-wrap: wrap;
        }

        .nav-tab-btn {
            padding: 0.75rem 1.25rem;
            background: none;
            border: none;
            color: var(--text-color);
            font-weight: 600;
            font-size: 0.95rem;
            cursor: pointer;
            opacity: 0.6;
            border-bottom: 3px solid transparent;
            transition: opacity 0.2s, border-color 0.2s;
        }

        .nav-tab-btn.active {
            opacity: 1;
            border-bottom-color: var(--primary-blue);
        }

        .tab-section {
            display: none;
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 1.5rem;
            box-shadow: var(--shadow);
        }

        .tab-section.active {
            display: block;
        }

        .section-title {
            font-size: 1.1rem;
            font-weight: 700;
            margin-bottom: 1rem;
        }

        .form-row {
            display: flex;
            gap: 1rem;
            margin-bottom: 1.5rem;
            flex-wrap: wrap;
        }

        .form-row input,
        .form-row select {
            flex: 1;
            min-width: 200px;
            padding: 0.65rem 0.8rem;
            background-color: var(--input-bg);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            color: var(--text-color);
            outline: none;
        }

        .btn-primary {
            background-color: var(--primary-blue);
            color: #ffffff;
            border: none;
            padding: 0.65rem 1.2rem;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .btn-primary:hover {
            background-color: var(--primary-hover);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 1rem;
        }

        th, td {
            padding: 0.75rem 1rem;
            text-align: left;
            border-bottom: 1px solid var(--border-color);
        }

        th {
            background-color: var(--table-header-bg);
            font-weight: 600;
        }

        .btn-delete {
            background-color: var(--danger-red);
            color: white;
            border: none;
            padding: 0.35rem 0.75rem;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.85rem;
        }

        .btn-delete:hover {
            background-color: var(--danger-hover);
        }

        .ficha-card {
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 1rem;
            margin-bottom: 1rem;
            background-color: var(--bg-color);
        }

        .ficha-header {
            font-weight: 700;
            margin-bottom: 0.5rem;
            color: var(--primary-blue);
        }
    </style>
</head>
<body>

    <header>
        <div class="header-title">Painel do Administrador</div>
        <div class="header-actions">
            <span id="userBadge" class="user-badge">Admin</span>
            <button id="themeToggle" class="icon-btn" aria-label="Alternar Tema">
                <svg id="themeIcon" viewBox="0 0 24 24">
                    <path d="M12.3 2a10 10 0 0 0 9.7 11.5 10 10 0 1 1-11.5-9.7z"/>
                </svg>
            </button>
            <button onclick="fazerLogout()" class="btn-logout">Sair</button>
        </div>
    </header>

    <main>
        <div class="nav-tabs">
            <button class="nav-tab-btn active" onclick="switchSection('fichas')">Visualizar Fichas</button>
            <button class="nav-tab-btn" onclick="switchSection('turmas')">Turmas</button>
            <button class="nav-tab-btn" onclick="switchSection('materias')">Matérias</button>
            <button class="nav-tab-btn" onclick="switchSection('professores')">Professores</button>
            <button class="nav-tab-btn" onclick="switchSection('vinculos')">Vínculos</button>
        </div>

        <!-- SESSÃO: VISUALIZAR FICHAS DE AVALIAÇÃO -->
        <div id="sec-fichas" class="tab-section active">
            <div class="section-title">Fichas e Avaliações Registradas</div>
            <div id="containerFichas">Carregando fichas...</div>
        </div>

        <!-- SESSÃO: TURMAS -->
        <div id="sec-turmas" class="tab-section">
            <div class="section-title">Gerenciamento de Turmas</div>
            <form id="formTurma" class="form-row">
                <input type="text" id="inputTurmaNome" placeholder="Nome da Turma (Ex: 9º Ano A)" required>
                <button type="submit" class="btn-primary">Adicionar Turma</button>
            </form>
            <table>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Nome da Turma</th>
                        <th>Ações</th>
                    </tr>
                </thead>
                <tbody id="tabelaTurmas"></tbody>
            </table>
        </div>

        <!-- SESSÃO: MATÉRIAS -->
        <div id="sec-materias" class="tab-section">
            <div class="section-title">Gerenciamento de Matérias</div>
            <form id="formMateria" class="form-row">
                <input type="text" id="inputMateriaNome" placeholder="Nome da Matéria (Ex: Matemática)" required>
                <button type="submit" class="btn-primary">Adicionar Matéria</button>
            </form>
            <table>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Matéria</th>
                        <th>Ações</th>
                    </tr>
                </thead>
                <tbody id="tabelaMaterias"></tbody>
            </table>
        </div>

        <!-- SESSÃO: PROFESSORES -->
        <div id="sec-professores" class="tab-section">
            <div class="section-title">Professores Cadastrados</div>
            <form id="formProfessor" class="form-row">
                <input type="text" id="inputProfNome" placeholder="Nome do Professor" required>
                <input type="email" id="inputProfEmail" placeholder="email@escola.com" required>
                <button type="submit" class="btn-primary">Cadastrar Professor</button>
            </form>
            <table>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Nome</th>
                        <th>E-mail</th>
                        <th>Tipo</th>
                        <th>Ações</th>
                    </tr>
                </thead>
                <tbody id="tabelaProfessores"></tbody>
            </table>
        </div>

        <!-- SESSÃO: VÍNCULOS -->
        <div id="sec-vinculos" class="tab-section">
            <div class="section-title">Vincular Professor a Turma e Matéria</div>
            <form id="formVinculo" class="form-row">
                <select id="selectProfVinculo" required><option value="">Selecione o Professor</option></select>
                <select id="selectTurmaVinculo" required><option value="">Selecione a Turma</option></select>
                <select id="selectMateriaVinculo" required><option value="">Selecione a Matéria</option></select>
                <button type="submit" class="btn-primary">Criar Vínculo</button>
            </form>
            <table>
                <thead>
                    <tr>
                        <th>Professor</th>
                        <th>Turma</th>
                        <th>Matéria</th>
                    </tr>
                </thead>
                <tbody id="tabelaVinculos"></tbody>
            </table>
        </div>
    </main>

    <script>
        // Inicialização do usuário na interface
        const usuarioLogado = JSON.parse(localStorage.getItem('usuario') || localStorage.getItem('user') || '{}');
        document.getElementById('userBadge').textContent = usuarioLogado.nome || 'Administrador';

        // Alternância de Abas
        function switchSection(sec) {
            document.querySelectorAll('.nav-tab-btn').forEach(btn => btn.classList.remove('active'));
            document.querySelectorAll('.tab-section').forEach(s => s.classList.remove('active'));

            event.target.classList.add('active');
            document.getElementById(`sec-${sec}`).classList.add('active');

            if (sec === 'turmas') carregarTurmas();
            if (sec === 'materias') carregarMaterias();
            if (sec === 'professores') carregarProfessores();
            if (sec === 'vinculos') carregarVinculosForm();
            if (sec === 'fichas') carregarFichas();
        }

        // Dark Mode com Ícones SVG
        const themeBtn = document.getElementById('themeToggle');
        const themeIcon = document.getElementById('themeIcon');
        const moonSvg = `<path d="M12.3 2a10 10 0 0 0 9.7 11.5 10 10 0 1 1-11.5-9.7z"/>`;
        const sunSvg = `<path d="M12 7a5 5 0 1 0 0 10 5 5 0 0 0 0-10zm0-5a1 1 0 0 1 1 1v2a1 1 0 0 1-2 0V3a1 1 0 0 1 1-1zm0 17a1 1 0 0 1 1 1v2a1 1 0 0 1-2 0v-2a1 1 0 0 1 1-1zm9-9a1 1 0 0 1-1 1h-2a1 1 0 0 1 0-2h2a1 1 0 0 1 1 1zM5 12a1 1 0 0 1-1 1H2a1 1 0 0 1 0-2h2a1 1 0 0 1 1 1zm14.364-6.364a1 1 0 0 1 0 1.414l-1.414 1.414a1 1 0 0 1-1.414-1.414l1.414-1.414a1 1 0 0 1 1.414 0zM7.05 16.95a1 1 0 0 1 0 1.414l-1.414 1.414a1 1 0 0 1-1.414-1.414l1.414-1.414a1 1 0 0 1 1.414 0zm12.728 12.728a1 1 0 0 1-1.414 0l-1.414-1.414a1 1 0 0 1 1.414-1.414l1.414 1.414a1 1 0 0 1 0 1.414zM7.05 7.05a1 1 0 0 1-1.414 0L4.222 5.636a1 1 0 0 1 1.414-1.414l1.414 1.414a1 1 0 0 1 0 1.414z"/>`;

        if (localStorage.getItem('theme') === 'dark') {
            document.documentElement.setAttribute('data-theme', 'dark');
            themeIcon.innerHTML = sunSvg;
        }

        themeBtn.addEventListener('click', () => {
            const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
            if (isDark) {
                document.documentElement.removeAttribute('data-theme');
                localStorage.setItem('theme', 'light');
                themeIcon.innerHTML = moonSvg;
            } else {
                document.documentElement.setAttribute('data-theme', 'dark');
                localStorage.setItem('theme', 'dark');
                themeIcon.innerHTML = sunSvg;
            }
        });

        function fazerLogout() {
            localStorage.clear();
            window.location.href = 'index.html';
        }

        // --- REQUISIÇÕES DA API ---

        async function carregarTurmas() {
            try {
                const res = await fetch('/api/turmas');
                const turmas = await res.json();
                const tbody = document.getElementById('tabelaTurmas');
                tbody.innerHTML = turmas.map(t => `
                    <tr>
                        <td>${t.id}</td>
                        <td>${t.nome}</td>
                        <td><button class="btn-delete" onclick="deletarItem('/api/turmas/${t.id}', carregarTurmas)">Excluir</button></td>
                    </tr>
                `).join('');
            } catch (err) { console.error(err); }
        }

        async function carregarMaterias() {
            try {
                const res = await fetch('/api/materias');
                const materias = await res.json();
                const tbody = document.getElementById('tabelaMaterias');
                tbody.innerHTML = materias.map(m => `
                    <tr>
                        <td>${m.id}</td>
                        <td>${m.nome}</td>
                        <td><button class="btn-delete" onclick="deletarItem('/api/materias/${m.id}', carregarMaterias)">Excluir</button></td>
                    </tr>
                `).join('');
            } catch (err) { console.error(err); }
        }

        async function carregarProfessores() {
            try {
                const res = await fetch('/api/professores');
                const profs = await res.json();
                const tbody = document.getElementById('tabelaProfessores');
                tbody.innerHTML = profs.map(p => `
                    <tr>
                        <td>${p.id}</td>
                        <td>${p.nome}</td>
                        <td>${p.email || '-'}</td>
                        <td>${p.tipo || 'professor'}</td>
                        <td><button class="btn-delete" onclick="deletarItem('/api/professores/${p.id}', carregarProfessores)">Excluir</button></td>
                    </tr>
                `).join('');
            } catch (err) { console.error(err); }
        }

        async function carregarVinculosForm() {
            try {
                const [profs, turmas, mats, vinculos] = await Promise.all([
                    fetch('/api/professores').then(r => r.json()),
                    fetch('/api/turmas').then(r => r.json()),
                    fetch('/api/materias').then(r => r.json()),
                    fetch('/api/vinculos').then(r => r.json())
                ]);

                document.getElementById('selectProfVinculo').innerHTML = '<option value="">Selecione o Professor</option>' + profs.map(p => `<option value="${p.id}">${p.nome}</option>`).join('');
                document.getElementById('selectTurmaVinculo').innerHTML = '<option value="">Selecione a Turma</option>' + turmas.map(t => `<option value="${t.id}">${t.nome}</option>`).join('');
                document.getElementById('selectMateriaVinculo').innerHTML = '<option value="">Selecione a Matéria</option>' + mats.map(m => `<option value="${m.id}">${m.nome}</option>`).join('');

                const tbody = document.getElementById('tabelaVinculos');
                tbody.innerHTML = vinculos.map(v => `
                    <tr>
                        <td>${v.professores?.nome || 'Professor N/A'}</td>
                        <td>${v.turmas?.nome || 'Turma N/A'}</td>
                        <td>${v.materias?.nome || 'Matéria N/A'}</td>
                    </tr>
                `).join('');
            } catch (err) { console.error(err); }
        }

        async function carregarFichas() {
            const container = document.getElementById('containerFichas');
            try {
                const res = await fetch('/api/professor/fichas/admin');
                const fichas = await res.json();

                if (!fichas || fichas.length === 0) {
                    container.innerHTML = '<p>Nenhuma ficha registrada até o momento.</p>';
                    return;
                }

                container.innerHTML = fichas.map(f => `
                    <div class="ficha-card">
                        <div class="ficha-header">${f.turmas?.nome || 'Turma'} - ${f.materias?.nome || 'Matéria'}</div>
                        <div><strong>Professor:</strong> ${f.professores?.nome || 'Não atribuído'}</div>
                    </div>
                `).join('');
            } catch (err) {
                container.innerHTML = '<p>Erro ao carregar fichas de avaliação.</p>';
            }
        }

        async function deletarItem(url, callback) {
            if (!confirm('Deseja realmente excluir este registro?')) return;
            try {
                await fetch(url, { method: 'DELETE' });
                callback();
            } catch (err) { alert('Erro ao excluir registro.'); }
        }

        // Handlers de formulários
        document.getElementById('formTurma').addEventListener('submit', async (e) => {
            e.preventDefault();
            const nome = document.getElementById('inputTurmaNome').value;
            await fetch('/api/turmas', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ nome }) });
            document.getElementById('inputTurmaNome').value = '';
            carregarTurmas();
        });

        document.getElementById('formMateria').addEventListener('submit', async (e) => {
            e.preventDefault();
            const nome = document.getElementById('inputMateriaNome').value;
            await fetch('/api/materias', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ nome }) });
            document.getElementById('inputMateriaNome').value = '';
            carregarMaterias();
        });

        document.getElementById('formProfessor').addEventListener('submit', async (e) => {
            e.preventDefault();
            const nome = document.getElementById('inputProfNome').value;
            const email = document.getElementById('inputProfEmail').value;
            await fetch('/api/professores', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ nome, email }) });
            document.getElementById('inputProfNome').value = '';
            document.getElementById('inputProfEmail').value = '';
            carregarProfessores();
        });

        document.getElementById('formVinculo').addEventListener('submit', async (e) => {
            e.preventDefault();
            const professor_id = document.getElementById('selectProfVinculo').value;
            const turma_id = document.getElementById('selectTurmaVinculo').value;
            const materia_id = document.getElementById('selectMateriaVinculo').value;
            await fetch('/api/vinculos', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ professor_id, turma_id, materia_id }) });
            carregarVinculosForm();
        });

        // Carrega as fichas ao iniciar
        carregarFichas();
    </script>
</body>
</html>

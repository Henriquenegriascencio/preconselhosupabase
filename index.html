<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pré-Conselho - Autenticação</title>
    <style>
        :root {
            --bg-color: #ffffff;
            --card-bg: #f8f9fa;
            --text-color: #000000;
            --border-color: #d1d5db;
            --primary-blue: #0056b3;
            --primary-hover: #003d82;
            --input-bg: #ffffff;
            --shadow: 0 4px 12px rgba(0, 0, 0, 0.08);
        }

        [data-theme="dark"] {
            --bg-color: #000000;
            --card-bg: #121212;
            --text-color: #ffffff;
            --border-color: #27272a;
            --primary-blue: #1f6beb;
            --primary-hover: #388bfd;
            --input-bg: #1a1a1a;
            --shadow: 0 4px 12px rgba(0, 0, 0, 0.6);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            transition: background-color 0.3s, color 0.3s;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1rem 2rem;
            background-color: var(--card-bg);
            border-bottom: 1px solid var(--border-color);
        }

        .logo-title {
            font-size: 1.25rem;
            font-weight: 700;
            color: var(--primary-blue);
        }

        .theme-toggle-btn {
            background: none;
            border: 1px solid var(--border-color);
            padding: 8px;
            border-radius: 8px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-color);
        }

        .theme-toggle-btn svg {
            width: 20px;
            height: 20px;
            fill: currentColor;
        }

        main {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem 1rem;
        }

        .auth-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            width: 100%;
            max-width: 420px;
            padding: 2rem;
            box-shadow: var(--shadow);
        }

        .tabs {
            display: flex;
            border-bottom: 2px solid var(--border-color);
            margin-bottom: 1.5rem;
        }

        .tab-btn {
            flex: 1;
            padding: 0.75rem;
            background: none;
            border: none;
            color: var(--text-color);
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            opacity: 0.6;
        }

        .tab-btn.active {
            opacity: 1;
            border-bottom: 3px solid var(--primary-blue);
            color: var(--primary-blue);
            margin-bottom: -2px;
        }

        .form-group {
            margin-bottom: 1.25rem;
        }

        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            font-size: 0.875rem;
            font-weight: 600;
        }

        .form-group input,
        .form-group select {
            width: 100%;
            padding: 0.75rem;
            background-color: var(--input-bg);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            color: var(--text-color);
            font-size: 0.95rem;
            outline: none;
        }

        .form-group input:focus,
        .form-group select:focus {
            border-color: var(--primary-blue);
        }

        .submit-btn {
            width: 100%;
            padding: 0.85rem;
            background-color: var(--primary-blue);
            color: #ffffff;
            border: none;
            border-radius: 6px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s;
            margin-top: 0.5rem;
        }

        .submit-btn:hover {
            background-color: var(--primary-hover);
        }

        .form-container { display: none; }
        .form-container.active { display: block; }
    </style>
</head>
<body>

    <header>
        <div class="logo-title">Pré-Conselho Escolar</div>
        <button id="themeToggle" class="theme-toggle-btn" aria-label="Alternar Tema">
            <svg id="themeIcon" viewBox="0 0 24 24">
                <path d="M12.3 2a10 10 0 0 0 9.7 11.5 10 10 0 1 1-11.5-9.7z"/>
            </svg>
        </button>
    </header>

    <main>
        <div class="auth-card">
            <div class="tabs">
                <button class="tab-btn active" id="tabLoginBtn" onclick="switchTab('login')">Entrar</button>
                <button class="tab-btn" id="tabCadBtn" onclick="switchTab('cadastro')">Cadastrar</button>
            </div>

            <!-- FORMULÁRIO DE LOGIN -->
            <div id="loginContainer" class="form-container active">
                <form id="loginForm">
                    <div class="form-group">
                        <label for="loginEmail">E-mail ou Utilizador</label>
                        <input type="text" id="loginEmail" placeholder="Digite seu e-mail ou nome" required>
                    </div>
                    <div class="form-group">
                        <label for="loginSenha">Senha</label>
                        <input type="password" id="loginSenha" placeholder="••••••••" required>
                    </div>
                    <button type="submit" class="submit-btn">Entrar</button>
                </form>
            </div>

            <!-- FORMULÁRIO DE CADASTRO -->
            <div id="cadContainer" class="form-container">
                <form id="cadForm">
                    <div class="form-group">
                        <label for="cadNome">Nome Completo</label>
                        <input type="text" id="cadNome" placeholder="Ex: Maria Silva" required>
                    </div>
                    <div class="form-group">
                        <label for="cadEmail">E-mail</label>
                        <input type="email" id="cadEmail" placeholder="exemplo@escola.com" required>
                    </div>
                    <div class="form-group">
                        <label for="cadSenha">Senha</label>
                        <input type="password" id="cadSenha" placeholder="••••••••" required>
                    </div>
                    <div class="form-group">
                        <label for="cadTipo">Tipo de Conta</label>
                        <select id="cadTipo" required>
                            <option value="professor">Professor</option>
                            <option value="admin">Administrador</option>
                        </select>
                    </div>
                    <button type="submit" class="submit-btn">Criar Conta</button>
                </form>
            </div>
        </div>
    </main>

    <script>
        function switchTab(tab) {
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            document.querySelectorAll('.form-container').forEach(cnt => cnt.classList.remove('active'));

            if (tab === 'login') {
                document.getElementById('tabLoginBtn').classList.add('active');
                document.getElementById('loginContainer').classList.add('active');
            } else {
                document.getElementById('tabCadBtn').classList.add('active');
                document.getElementById('cadContainer').classList.add('active');
            }
        }

        const themeBtn = document.getElementById('themeToggle');
        const themeIcon = document.getElementById('themeIcon');
        const moonSvg = `<path d="M12.3 2a10 10 0 0 0 9.7 11.5 10 10 0 1 1-11.5-9.7z"/>`;
        const sunSvg = `<path d="M12 7a5 5 0 1 0 0 10 5 5 0 0 0 0-10zm0-5a1 1 0 0 1 1 1v2a1 1 0 0 1-2 0V3a1 1 0 0 1 1-1zm0 17a1 1 0 0 1 1 1v2a1 1 0 0 1-2 0v-2a1 1 0 0 1 1-1zm9-9a1 1 0 0 1-1 1h-2a1 1 0 0 1 0-2h2a1 1 0 0 1 1 1zM5 12a1 1 0 0 1-1 1H2a1 1 0 0 1 0-2h2a1 1 0 0 1 1 1zm14.364-6.364a1 1 0 0 1 0 1.414l-1.414 1.414a1 1 0 0 1-1.414-1.414l1.414-1.414a1 1 0 0 1 1.414 0zM7.05 16.95a1 1 0 0 1 0 1.414l-1.414 1.414a1 1 0 0 1-1.414-1.414l1.414-1.414a1 1 0 0 1 1.414 0zm12.728 12.728a1 1 0 0 1-1.414 0l-1.414-1.414a1 1 0 0 1 1.414-1.414l1.414 1.414a1 1 0 0 1 0 1.414zM7.05 7.05a1 1 0 0 1-1.414 0L4.222 5.636a1 1 0 0 1 1.414-1.414l1.414 1.414a1 1 0 0 1 0 1.414z"/>`;

        if (localStorage.getItem('theme') === 'dark') {
            document.documentElement.setAttribute('data-theme', 'dark');
            themeIcon.innerHTML = sunSvg;
        }

        themeBtn.addEventListener('click', () => {
            const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
            if (isDark) {
                document.documentElement.removeAttribute('data-theme');
                localStorage.setItem('theme', 'light');
                themeIcon.innerHTML = moonSvg;
            } else {
                document.documentElement.setAttribute('data-theme', 'dark');
                localStorage.setItem('theme', 'dark');
                themeIcon.innerHTML = sunSvg;
            }
        });

        // LOGIN (Auto-deteção do perfil pelo banco)
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const login = document.getElementById('loginEmail').value.trim();
            const senha = document.getElementById('loginSenha').value.trim();

            try {
                const res = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email: login, usuario: login, senha })
                });

                const data = await res.json();

                if (data.success) {
                    localStorage.setItem('usuario', JSON.stringify(data.usuario));
                    window.location.href = data.redirect;
                } else {
                    alert(data.error || 'Erro ao realizar login.');
                }
            } catch (err) {
                alert('Erro de conexão com o servidor.');
            }
        });

        // CADASTRO
        document.getElementById('cadForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const nome = document.getElementById('cadNome').value.trim();
            const email = document.getElementById('cadEmail').value.trim();
            const senha = document.getElementById('cadSenha').value.trim();
            const tipo = document.getElementById('cadTipo').value;

            try {
                const res = await fetch('/api/auth/cadastro', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ nome, email, senha, tipo })
                });

                const data = await res.json();

                if (data.success) {
                    alert(data.message || 'Cadastro realizado com sucesso!');
                    localStorage.setItem('usuario', JSON.stringify(data.usuario));
                    window.location.href = data.redirect;
                } else {
                    alert(data.error || 'Erro ao realizar cadastro.');
                }
            } catch (err) {
                alert('Erro de conexão com o servidor.');
            }
        });
    </script>
</body>
</html>

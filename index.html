<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Pré-Conselho</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { 
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            min-height: 100vh; 
            background: linear-gradient(135deg, #0f172a 0%, #1e3a8a 100%);
            padding: 20px;
        }
        .card { 
            background: #ffffff; 
            padding: 35px 30px; 
            border-radius: 12px; 
            box-shadow: 0 10px 25px rgba(0,0,0,0.25); 
            width: 100%; 
            max-width: 400px; 
        }
        .brand-header { text-align: center; margin-bottom: 25px; }
        .brand-header h2 { font-size: 26px; color: #0f172a; font-weight: 700; }
        .brand-header p { font-size: 14px; color: #64748b; margin-top: 4px; }
        
        h3 { font-size: 18px; color: #0f172a; margin-bottom: 15px; }
        label { display: block; margin-top: 12px; font-weight: 600; font-size: 13px; color: #334155; text-transform: uppercase; letter-spacing: 0.5px; }
        
        input, select { 
            width: 100%; 
            padding: 11px 14px; 
            margin-top: 6px; 
            border: 1px solid #cbd5e1; 
            border-radius: 6px; 
            font-size: 15px;
            color: #0f172a;
            background-color: #f8fafc;
            transition: all 0.2s ease;
        }
        input:focus, select:focus {
            outline: none;
            border-color: #2563eb;
            background-color: #ffffff;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
        }

        button { 
            width: 100%; 
            padding: 12px; 
            margin-top: 18px; 
            border: none; 
            border-radius: 6px; 
            font-size: 15px; 
            font-weight: 600; 
            cursor: pointer; 
            transition: background-color 0.2s ease, transform 0.1s ease;
        }
        button:active { transform: scale(0.99); }
        
        .btn-blue { background-color: #1d4ed8; color: #ffffff; }
        .btn-blue:hover { background-color: #1e40af; }
        
        .btn-black { background-color: #0f172a; color: #ffffff; }
        .btn-black:hover { background-color: #000000; }
        
        .divider { 
            margin: 25px 0; 
            border: 0; 
            border-top: 1px solid #e2e8f0; 
            position: relative;
        }
    </style>
</head>
<body>

<div class="card">
    <div class="brand-header">
        <h2>Pré-Conselho</h2>
        <p>Sistema de Avaliação Escolar</p>
    </div>
    
    <form id="formLogin">
        <label>E-mail</label>
        <input type="email" id="loginEmail" placeholder="seu@email.com" required>
        
        <label>Senha</label>
        <input type="password" id="loginSenha" placeholder="••••••••" required>
        
        <button type="submit" class="btn-blue">Entrar no Sistema</button>
    </form>

    <div class="divider"></div>

    <h3>Criar Conta</h3>
    <form id="formCadastro">
        <label>Nome Completo</label>
        <input type="text" id="cadNome" placeholder="Nome do Usuário" required>
        
        <label>E-mail</label>
        <input type="email" id="cadEmail" placeholder="seu@email.com" required>
        
        <label>Senha</label>
        <input type="password" id="cadSenha" placeholder="••••••••" required>
        
        <label>Perfil</label>
        <select id="cadTipo">
            <option value="Professor">Professor</option>
            <option value="Admin">Administrador</option>
        </select>
        
        <button type="submit" class="btn-black">Cadastrar Usuário</button>
    </form>
</div>

<script>
    const API_URL = window.location.hostname === 'localhost' 
        ? 'http://localhost:3000' 
        : 'https://preconselhosupabase.onrender.com';

    document.getElementById('formLogin').addEventListener('submit', async (e) => {
        e.preventDefault();
        const email = document.getElementById('loginEmail').value;
        const senha = document.getElementById('loginSenha').value;

        try {
            const response = await fetch(`${API_URL}/api/auth/login`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email, senha })
            });

            const data = await response.json();

            if (response.ok) {
                localStorage.setItem('usuario', JSON.stringify(data.usuario));
                if (data.usuario.tipo === 'Admin') {
                    window.location.href = 'admin.html';
                } else {
                    window.location.href = 'professor.html';
                }
            } else {
                alert(data.error || 'Erro ao efetuar login.');
            }
        } catch (err) {
            alert('Erro na conexão com o servidor.');
        }
    });

    document.getElementById('formCadastro').addEventListener('submit', async (e) => {
        e.preventDefault();
        const nome = document.getElementById('cadNome').value;
        const email = document.getElementById('cadEmail').value;
        const senha = document.getElementById('cadSenha').value;
        const tipo = document.getElementById('cadTipo').value;

        try {
            const response = await fetch(`${API_URL}/api/auth/cadastro`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ nome, email, senha, tipo })
            });

            const data = await response.json();

            if (response.ok) {
                alert('Conta criada com sucesso! Faça login.');
                document.getElementById('formCadastro').reset();
            } else {
                alert(data.error || 'Erro ao cadastrar.');
            }
        } catch (err) {
            alert('Erro na conexão com o servidor.');
        }
    });
</script>

</body>
</html>

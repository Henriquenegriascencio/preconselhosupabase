<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Pré-Conselho</title>
    <style>
        body { font-family: Arial, sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; background-color: #f4f4f9; margin: 0; }
        .card { background: white; padding: 25px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); width: 320px; }
        h2, h3 { text-align: center; color: #333; margin-bottom: 15px; }
        label { display: block; margin-top: 10px; font-weight: bold; font-size: 14px; }
        input, select { width: 100%; padding: 8px; margin-top: 4px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; }
        button { width: 100%; padding: 10px; margin-top: 15px; border: none; border-radius: 4px; font-size: 16px; cursor: pointer; color: white; }
        .btn-blue { background-color: #2563eb; }
        .btn-dark { background-color: #4b5563; }
        hr { margin: 20px 0; border: 0; border-top: 1px solid #ddd; }
    </style>
</head>
<body>

<div class="card">
    <h2>Pré-Conselho</h2>
    
    <form id="formLogin">
        <label>E-mail:</label>
        <input type="email" id="loginEmail" required>
        
        <label>Senha:</label>
        <input type="password" id="loginSenha" required>
        
        <button type="submit" class="btn-blue">Entrar</button>
    </form>

    <hr>

    <h3>Criar Conta</h3>
    <form id="formCadastro">
        <label>Nome Completo:</label>
        <input type="text" id="cadNome" required>
        
        <label>E-mail:</label>
        <input type="email" id="cadEmail" required>
        
        <label>Senha:</label>
        <input type="password" id="cadSenha" required>
        
        <label>Perfil:</label>
        <select id="cadTipo">
            <option value="Professor">Professor</option>
            <option value="Admin">Administrador</option>
        </select>
        
        <button type="submit" class="btn-dark">Cadastrar</button>
    </form>
</div>

<script>

const API_URL = window.location.hostname === 'localhost' 
    ? 'http://localhost:3000' 
    : 'https://preconselhosupabase.onrender.com'; // <-- Cole a URL do Render aqui
    document.getElementById('formLogin').addEventListener('submit', async (e) => {
        e.preventDefault();
        const email = document.getElementById('loginEmail').value;
        const senha = document.getElementById('loginSenha').value;

        try {
            const response = await fetch(`${API_URL}/api/auth/login`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email, senha })
            });

            const data = await response.json();

            if (response.ok) {
                localStorage.setItem('usuario', JSON.stringify(data.usuario));
                if (data.usuario.tipo === 'Admin') {
                    window.location.href = 'index.html';
                } else {
                    window.location.href = 'professor.html';
                }
            } else {
                alert(data.error || 'Erro ao efetuar login.');
            }
        } catch (err) {
            alert('Erro na conexão com o servidor.');
        }
    });

    document.getElementById('formCadastro').addEventListener('submit', async (e) => {
        e.preventDefault();
        const nome = document.getElementById('cadNome').value;
        const email = document.getElementById('cadEmail').value;
        const senha = document.getElementById('cadSenha').value;
        const tipo = document.getElementById('cadTipo').value;

        try {
            const response = await fetch(`${API_URL}/api/auth/cadastro`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ nome, email, senha, tipo })
            });

            const data = await response.json();

            if (response.ok) {
                alert('Conta criada com sucesso! Faça login.');
                document.getElementById('formCadastro').reset();
            } else {
                alert(data.error || 'Erro ao cadastrar.');
            }
        } catch (err) {
            alert('Erro na conexão com o servidor.');
        }
    });
</script>

</body>
</html>
